spring:
  application:
    name: scenario-simulator
  profiles:
    active: local
  flyway:
    enabled: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      service: scenario-simulator
      env: ${SPRING_ENV:dev}
      region: seoul

simulator:
  sqs:
    enabled: false
    region: ap-northeast-2
    endpoint-override: ""
    cache-refresh-queue-url: ""
    readmodel-refresh-queue-url: ""
