spring:
  application:
    name: pre-scaling-controller
  profiles:
    active: local

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/safespot}
    username: ${DB_USERNAME:safespot}
    password: ${DB_PASSWORD:safespot}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      connection-timeout: 5000
      idle-timeout: 300000

server:
  port: 8084
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      service: pre-scaling-controller
      env: ${SPRING_ENV:dev}
      region: seoul

pre-scaling:
  enabled: true
  namespace: ${K8S_NAMESPACE:application}
  polling-interval-ms: 30000

  trigger:
    disaster-types:
      - EARTHQUAKE
      - FLOOD
      - LANDSLIDE
    min-level-rank: 3
    lookback-minutes: 10

  surge:
    target-hpa-name: ${PRE_SCALING_SURGE_TARGET_HPA_NAME:api-public-read-surge}
    normal-min-replicas: ${PRE_SCALING_SURGE_NORMAL_MIN_REPLICAS:1}
    peak-min-replicas: ${PRE_SCALING_SURGE_PEAK_MIN_REPLICAS:8}
    sustained-min-replicas: ${PRE_SCALING_SURGE_SUSTAINED_MIN_REPLICAS:3}
    peak-window-seconds: ${PRE_SCALING_SURGE_PEAK_WINDOW_SECONDS:1800}

  base:
    enabled: ${PRE_SCALING_BASE_ENABLED:true}
    target-hpa-name: ${PRE_SCALING_BASE_TARGET_HPA_NAME:api-public-read}
    normal-min-replicas: ${PRE_SCALING_BASE_NORMAL_MIN_REPLICAS:1}
    normal-max-replicas: ${PRE_SCALING_BASE_NORMAL_MAX_REPLICAS:5}
    disaster-min-replicas: ${PRE_SCALING_BASE_DISASTER_MIN_REPLICAS:1}
    disaster-max-replicas: ${PRE_SCALING_BASE_DISASTER_MAX_REPLICAS:1}
    restrict-after-routing: ${PRE_SCALING_BASE_RESTRICT_AFTER_ROUTING:true}

  routing:
    enabled: ${PRE_SCALING_ROUTING_ENABLED:true}
    ingress-name: ${PRE_SCALING_ROUTING_INGRESS_NAME:api-public-read}
    action-annotation-key: ${PRE_SCALING_ROUTING_ACTION_ANNOTATION_KEY:alb.ingress.kubernetes.io/actions.api-public-read-weighted}
    base-service-name: ${PRE_SCALING_ROUTING_BASE_SERVICE_NAME:api-public-read}
    surge-service-name: ${PRE_SCALING_ROUTING_SURGE_SERVICE_NAME:api-public-read-surge}
    normal-base-weight: ${PRE_SCALING_ROUTING_NORMAL_BASE_WEIGHT:100}
    normal-surge-weight: ${PRE_SCALING_ROUTING_NORMAL_SURGE_WEIGHT:0}
    disaster-base-weight: ${PRE_SCALING_ROUTING_DISASTER_BASE_WEIGHT:0}
    disaster-surge-weight: ${PRE_SCALING_ROUTING_DISASTER_SURGE_WEIGHT:100}

  restore:
    base-readiness-timeout-seconds: ${PRE_SCALING_RESTORE_BASE_READINESS_TIMEOUT_SECONDS:120}
