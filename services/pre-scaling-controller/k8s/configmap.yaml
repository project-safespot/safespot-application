apiVersion: v1
kind: ConfigMap
metadata:
  name: pre-scaling-controller-config
  namespace: application
  labels:
    app: pre-scaling-controller
data:
  # Spring Boot relaxed binding: PRE_SCALING_ENABLED → pre-scaling.enabled
  PRE_SCALING_ENABLED: "true"
  K8S_NAMESPACE: "application"
  SPRING_ENV: "dev"

  # HPA target
  PRE_SCALING_TARGET_HPA_NAME: "api-public-read-surge"
  PRE_SCALING_NAMESPACE: "application"
  PRE_SCALING_POLLING_INTERVAL_MS: "30000"

  # Trigger policy
  PRE_SCALING_TRIGGER_MIN_LEVEL_RANK: "3"
  PRE_SCALING_TRIGGER_LOOKBACK_MINUTES: "10"
  # disaster-types is a List<String>; injected via application.yml default
  # Override with: PRE_SCALING_TRIGGER_DISASTER_TYPES_0=EARTHQUAKE etc. (Spring indexed list notation)

  # Surge policy
  PRE_SCALING_SURGE_NORMAL_MIN_REPLICAS: "0"
  PRE_SCALING_SURGE_DISASTER_MIN_REPLICAS: "3"
  PRE_SCALING_SURGE_MAX_REPLICAS: "10"
  PRE_SCALING_SURGE_COOLDOWN_SECONDS: "1800"
