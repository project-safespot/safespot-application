# DB Secret for pre-scaling-controller
#
# 이 파일은 실제 Secret을 직접 담지 않는다.
# 운영 환경(dev/prod)에서는 아래 두 가지 방법 중 하나로 생성한다.
#
# Option A — AWS Secrets Manager + External Secrets Operator (권장):
#   ExternalSecret CR을 적용하면 ESO가 AWS Secrets Manager에서 값을 가져와
#   아래 이름의 Secret을 자동 생성한다.
#
# Option B — kubectl create secret (임시/긴급):
#   kubectl -n application create secret generic pre-scaling-controller-db-secret \
#     --from-literal=url='jdbc:postgresql://<RDS_ENDPOINT>:5432/safespot' \
#     --from-literal=username='<DB_USER>' \
#     --from-literal=password='<DB_PASS>'
#
# Deployment 참조:
#   env.DB_URL      → pre-scaling-controller-db-secret / url
#   env.DB_USERNAME → pre-scaling-controller-db-secret / username
#   env.DB_PASSWORD → pre-scaling-controller-db-secret / password

---
# Option A: ExternalSecret (External Secrets Operator 설치 필요)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pre-scaling-controller-db-secret
  namespace: application
  labels:
    app: pre-scaling-controller
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: pre-scaling-controller-db-secret
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: safespot/dev/rds
        property: url
    - secretKey: username
      remoteRef:
        key: safespot/dev/rds
        property: username
    - secretKey: password
      remoteRef:
        key: safespot/dev/rds
        property: password
