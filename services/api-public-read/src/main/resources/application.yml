spring:
  application:
    name: api-public-read
  profiles:
    active: local

server:
  port: 8080
  servlet:
    context-path: /api/public

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      service: api-public-read
      env: ${SPRING_ENV:dev}
      region: seoul
    distribution:
      percentiles-histogram:
        http.server.requests: true