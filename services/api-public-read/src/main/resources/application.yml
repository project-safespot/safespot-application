spring:
  application:
    name: api-public-read

server:
  port: 8080
  servlet:
    context-path: /api/public

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: api-public-read
      service: api-public-read
      env: ${SPRING_ENV:dev}
      region: seoul
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2s,5s
