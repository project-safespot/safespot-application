spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      timeout: 1000ms
      connect-timeout: 500ms

server:
  port: 8080

safespot:
  cache-regeneration:
    publisher-mode: sqs
    publish-failure-file: /tmp/cache-regeneration-publish-failures.jsonl
  aws:
    sqs:
      endpoint: ${SQS_ENDPOINT:}
      cache-refresh-queue-url: ${CACHE_REFRESH_QUEUE_URL}
      readmodel-refresh-queue-url: ${READMODEL_REFRESH_QUEUE_URL}
      environment-cache-refresh-queue-url: ${ENVIRONMENT_CACHE_REFRESH_QUEUE_URL}
