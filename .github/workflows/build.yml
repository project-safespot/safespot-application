name: Build Async Worker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Build async-worker and pre-scaling-controller
        run: |
          ./gradlew \
            :services:async-worker:build \
            :services:async-worker:lambdaPackage \
            :services:pre-scaling-controller:build \
            --no-daemon