name: Build Backend Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      short-sha: ${{ steps.sha.outputs.short }}
      ecr-registry: ${{ steps.ecr.outputs.registry }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Build bootJars
        run: |
          ./gradlew :services:api-core:bootJar \
                    :services:api-public-read:bootJar \
                    :services:external-ingestion:bootJar \
                    :services:scenario-simulator:bootJar

      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image registry
        id: registry
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=local" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ steps.ecr.outputs.registry }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push api-core
        uses: docker/build-push-action@v5
        with:
          context: services/api-core
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.registry.outputs.value }}/safespot-dev-ops-ecr-api-core:${{ steps.sha.outputs.short }}

      - name: Build and push api-public-read
        uses: docker/build-push-action@v5
        with:
          context: services/api-public-read
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.registry.outputs.value }}/safespot-dev-ops-ecr-api-public-read:${{ steps.sha.outputs.short }}

      - name: Build and push external-ingestion
        uses: docker/build-push-action@v5
        with:
          context: services/external-ingestion
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.registry.outputs.value }}/safespot-dev-ops-ecr-external-ingestion:${{ steps.sha.outputs.short }}

      - name: Build and push scenario-simulator
        uses: docker/build-push-action@v5
        with:
          context: services/scenario-simulator
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.registry.outputs.value }}/safespot-dev-ops-ecr-scenario-simulator:${{ steps.sha.outputs.short }}

  update-manifest:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout k8s-manifest
        uses: actions/checkout@v4
        with:
          repository: project-safespot/safespot-application-k8s-manifest
          token: ${{ secrets.MANIFEST_REPO_TOKEN }}
          ref: feat/aws-gitops-cleanup
          path: k8s-manifest

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update image repositories and tags
        env:
          SHORT_SHA: ${{ needs.build.outputs.short-sha }}
          ECR_REGISTRY: ${{ needs.build.outputs.ecr-registry }}
        run: |
          cd k8s-manifest

          yq e '.apiCore.image.repository = strenv(ECR_REGISTRY) + "/safespot-dev-ops-ecr-api-core"' -i charts/safespot/values-dev.images.yaml
          yq e '.apiCore.image.tag = strenv(SHORT_SHA)' -i charts/safespot/values-dev.images.yaml

          yq e '.apiPublicRead.image.repository = strenv(ECR_REGISTRY) + "/safespot-dev-ops-ecr-api-public-read"' -i charts/safespot/values-dev.images.yaml
          yq e '.apiPublicRead.image.tag = strenv(SHORT_SHA)' -i charts/safespot/values-dev.images.yaml

          yq e '.externalIngestion.image.repository = strenv(ECR_REGISTRY) + "/safespot-dev-ops-ecr-external-ingestion"' -i charts/safespot/values-dev.images.yaml
          yq e '.externalIngestion.image.tag = strenv(SHORT_SHA)' -i charts/safespot/values-dev.images.yaml

          yq e '.scenarioSimulator.image.repository = strenv(ECR_REGISTRY) + "/safespot-dev-ops-ecr-scenario-simulator"' -i charts/safespot/values-dev.images.yaml
          yq e '.scenarioSimulator.image.tag = strenv(SHORT_SHA)' -i charts/safespot/values-dev.images.yaml

      - name: Commit and push if changed
        env:
          SHORT_SHA: ${{ needs.build.outputs.short-sha }}
        run: |
          cd k8s-manifest
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No manifest changes detected, skipping commit."
          else
            git add charts/safespot/values-dev.images.yaml
            git commit -m "chore: update backend ECR image tags to ${SHORT_SHA}"
            git push
          fi
