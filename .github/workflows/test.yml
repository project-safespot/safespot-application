name: test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - run: |
          ./gradlew \
            :services:async-worker:test \
            :services:async-worker:lambdaPackage \
            :services:pre-scaling-controller:test
